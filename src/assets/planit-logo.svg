<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="planit-title">
  <title id="planit-title">Planit logo</title>
  <!-- Black background -->
  <rect width="200" height="200" fill="#000000"/>
  <!-- Tall vertical stem of the "p" -->
  <rect x="52" y="38" width="30" height="130" fill="#ffffff"/>
  <!-- Oval bowl of the "p" — sits on the right side overlapping the stem -->
  <ellipse cx="107" cy="97" rx="45" ry="59" fill="#ffffff"/>
  <!-- Inner cutout to create the counter of the "p" -->
  <ellipse cx="107" cy="97" rx="24" ry="38" fill="#000000"/>
  <!-- Cover the left half of the bowl cutout area so it merges with stem -->
  <rect x="52" y="59" width="30" height="76" fill="#ffffff"/>
</svg>
